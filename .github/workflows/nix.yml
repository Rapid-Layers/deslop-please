name: Nix

on:
  push:
    branches: [nix]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            max-jobs = auto
            log-lines = 100

      # Pushes every path the job builds to the cache.
      - uses: cachix/cachix-action@v16
        with:
          name: rapid-layers
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix build -L

      - name: Lint itself
        run: nix shell nixpkgs#cargo nixpkgs#rustc -c ./result/bin/deslop-please
